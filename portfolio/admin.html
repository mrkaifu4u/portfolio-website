<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Panel - Mohamad Kaifoddin Portfolio">
    <title>Admin Panel | Mohamad Kaifoddin</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Link existing portfolio stylesheet to maintain styling and design consistency -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Custom Admin Panel Styles -->
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .admin-container {
            width: 100%;
            max-width: 800px;
            z-index: 10;
        }

        .login-card {
            max-width: 450px;
            margin: 0 auto;
            text-align: center;
            transform: scale(0.95);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
        }

        .dashboard-card {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        .card-visible {
            opacity: 1;
            transform: translate(0) scale(1);
        }

        .admin-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .admin-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--primary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-group label i {
            margin-right: 6px;
        }

        .btn-full {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: none;
            margin-top: 1rem;
        }

        .dashboard-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            border-top: 1px solid var(--glass-border);
            padding-top: 1.5rem;
        }

        .btn-logout {
            background: transparent;
            border: 2px solid var(--secondary);
            color: var(--secondary);
        }

        .btn-logout:hover {
            background: var(--secondary);
            color: #fff;
            box-shadow: 0 0 15px var(--secondary);
        }

        .message-alert {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .message-alert.error {
            background: rgba(252, 0, 122, 0.15);
            border: 1px solid var(--secondary);
            color: #ff4d94;
            display: block;
        }

        .message-alert.success {
            background: rgba(0, 225, 253, 0.15);
            border: 1px solid var(--primary);
            color: #80f0ff;
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-text-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Subtle loading screen overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-spinner-lg {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border-top-color: var(--primary);
            border-bottom-color: var(--secondary);
            animation: spin 1.5s linear infinite;
        }
    </style>
</head>
<body>
    <!-- ===== Loading Overlay ===== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner-lg"></div>
    </div>

    <!-- ===== Animated Background ===== -->
    <div class="background-animation">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="admin-container">
        <!-- ===== Login Section ===== -->
        <section class="glass-card login-card" id="loginSection">
            <div class="admin-header">
                <h1>Admin Login</h1>
                <p>Sign in to access your portfolio database</p>
            </div>
            
            <form id="loginForm" novalidate>
                <div class="form-group" style="margin-bottom: 1.2rem;">
                    <label for="loginEmail"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your admin email" required>
                    <div class="error-message" id="loginEmailError"></div>
                </div>
                
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    <div class="error-message" id="loginPasswordError"></div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                    <span class="btn-text-row">
                        <span>Sign In</span>
                        <span class="spinner" id="loginSpinner" style="display: none; margin-left: 0;"></span>
                    </span>
                </button>
                
                <div class="message-alert" id="loginAlert"></div>
            </form>
        </section>

        <!-- ===== Dashboard Section ===== -->
        <section class="glass-card dashboard-card" id="dashboardSection">
            <div class="admin-header">
                <h1>Admin Dashboard</h1>
                <p>Manage portfolio configurations & social integrations</p>
            </div>
            
            <form id="dashboardForm" novalidate>
                <div class="form-grid">
                    <!-- Column 1 -->
                    <div class="form-group">
                        <label for="navbarLogo"><i class="fas fa-signature"></i> Navbar Logo</label>
                        <input type="text" id="navbarLogo" placeholder="e.g., MOHAMAD." required>
                        <div class="error-message" id="logoError"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="portfolioName"><i class="fas fa-user"></i> Portfolio Name</label>
                        <input type="text" id="portfolioName" placeholder="e.g., Mohamad Kaifoddin" required>
                        <div class="error-message" id="nameError"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="resumeLink"><i class="fas fa-file-pdf"></i> Resume Google Drive Link</label>
                        <input type="url" id="resumeLink" placeholder="Google Drive view URL" required>
                        <div class="error-message" id="resumeError"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="instagramLink"><i class="fab fa-instagram"></i> Instagram Link</label>
                        <input type="url" id="instagramLink" placeholder="Instagram URL" required>
                        <div class="error-message" id="instagramError"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="linkedinLink"><i class="fab fa-linkedin-in"></i> LinkedIn Link</label>
                        <input type="url" id="linkedinLink" placeholder="LinkedIn URL" required>
                        <div class="error-message" id="linkedinError"></div>
                    </div>
                    
                    <!-- Column 2 -->
                    <div class="form-group">
                        <label for="githubLink"><i class="fab fa-github"></i> GitHub Link</label>
                        <input type="url" id="githubLink" placeholder="GitHub profile URL" required>
                        <div class="error-message" id="githubError"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="xLink"><i class="fab fa-x-twitter"></i> X (Twitter) Link</label>
                        <input type="url" id="xLink" placeholder="X profile URL" required>
                        <div class="error-message" id="xError"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
                        <input type="text" id="phone" placeholder="e.g., +91 98765 43210" required>
                        <div class="error-message" id="phoneError"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="location"><i class="fas fa-map-marker-alt"></i> Location</label>
                        <input type="text" id="location" placeholder="e.g., Hyderabad, India" required>
                        <div class="error-message" id="locationError"></div>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full" id="updateBtn">
                    <span class="btn-text-row">
                        <span>Save Changes</span>
                        <span class="spinner" id="updateSpinner" style="display: none; margin-left: 0;"></span>
                    </span>
                </button>
                
                <div class="message-alert" id="dashboardAlert"></div>
                
                <div class="dashboard-actions">
                    <span id="lastUpdated" style="font-size: 0.85rem; color: rgba(255, 255, 255, 0.4);">
                        Last updated: Never
                    </span>
                    <button type="button" class="btn btn-logout" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i> Log Out
                    </button>
                </div>
            </form>
        </section>
    </div>

    <!-- ===== JS APIs ===== -->
    <script src="api.js"></script>
    <script src="admin.js"></script>
</body>
</html>
